name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: slackmaint run --config configs/smoke.json --policies all
      - run: >-
          slackmaint convert-trace
          --input tests/fixtures/trace_smoke.jsonl
          --arm Direct
          --maintenance-ms 25
          --output /tmp/trace-smoke.json
      - run: slackmaint run --config /tmp/trace-smoke.json --policies all
