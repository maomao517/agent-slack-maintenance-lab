[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-slack-maintenance-lab"
version = "0.1.0"
description = "Trace-driven experiments for agent-aware background maintenance scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "maomao517" }]
dependencies = []

[project.scripts]
slackmaint = "slackmaint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

